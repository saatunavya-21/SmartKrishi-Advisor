spring.application.name=smart-krishi-advisor

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_krishi_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Server Configuration
server.port=8080

# Administrator Credentials (configurable via environment variables or properties)
admin.email=${ADMIN_EMAIL:admin@smartkrishi.com}
admin.password=${ADMIN_PASSWORD:Admin@123}

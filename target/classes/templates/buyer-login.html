<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Login - Smart Krishi Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 40px 20px;
            color: #263b2a;
        }

        .container {
            max-width: 420px;
            margin: auto;
            padding: 35px 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2e7d32;
            text-align: center;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 22px;
        }

        button:hover {
            background: #1b5e20;
        }

        .message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .links {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        .links a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🛒 Buyer Login</h2>
    <p class="subtitle">Access crop listings, market pricing, and submit procurement orders</p>

    <div th:if="${message}" class="message" th:text="${message}"></div>

    <form th:action="@{/buyer/login}" method="post">

        <label>Registered Email</label>
        <input type="email" name="email" placeholder="e.g. buyer@example.com" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Log In to Buyer Dashboard</button>

    </form>

    <div class="links">
        New agricultural buyer? <a th:href="@{/buyer/register}">Register here</a>
        <br><br>
        <a th:href="@{/}">← Back to Homepage</a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Registration - Smart Krishi Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 30px;
            color: #263b2a;
        }

        .container {
            background: white;
            max-width: 520px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #2e7d32;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
            font-size: 14px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            margin-bottom: 4px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }

        button:hover {
            background: #1b5e20;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-links a {
            color: #2e7d32;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🛒 Buyer Registration</h2>
    <p class="subtitle">Register your business to procure crops directly from verified farmers</p>

    <div th:if="${message}" class="success" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>

    <form th:action="@{/buyer/register}" method="post">

        <label>Buyer / Trader Name</label>
        <input type="text" name="name" placeholder="Enter your full name or company" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="e.g. buyer@example.com" required>

        <label>Password</label>
        <input type="password" name="password" minlength="6" placeholder="Choose a secure password" required>

        <label>Contact Phone</label>
        <input type="tel" name="phone" placeholder="10-digit mobile number" required>

        <label>Village / Locality</label>
        <input type="text" name="village" placeholder="Enter locality or village" required>

        <label>District</label>
        <input type="text" name="district" placeholder="Enter district" required>

        <label>State</label>
        <input type="text" name="state" placeholder="Enter state" required>

        <button type="submit">Complete Buyer Registration</button>

    </form>

    <div class="footer-links">
        Already registered? <a th:href="@{/buyer/login}">Log in here</a>
        <br><br>
        <a th:href="@{/}">← Back to Homepage</a>
    </div>

</div>

</body>
</html>

services:
  - type: web
    name: smart-krishi-advisor
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: admin@smartkrishi.com
      - key: ADMIN_PASSWORD
        value: Admin@123


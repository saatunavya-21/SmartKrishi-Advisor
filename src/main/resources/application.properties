spring.application.name=smart-krishi-advisor

# ─────────────────────────────────────────────────────────────────────────────
# Database Configuration
# Cloud Deployment: Spring Boot will read SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD from environment.
# Local Development: Defaults to localhost:3306/smart_krishi_db.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/smart_krishi_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration (auto-creates tables in cloud database on first boot)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Server Configuration - PORT env var is automatically assigned by Render/Railway
server.port=${PORT:8080}

# Administrator Credentials (configurable via environment variables)
admin.email=${ADMIN_EMAIL:admin@smartkrishi.com}
admin.password=${ADMIN_PASSWORD:Admin@123}


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin Activity Report</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 25px;
        }

        h1, h2 {
            color: #176b35;
        }

        .section {
            background: white;
            padding: 20px;
            margin: 25px 0;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #176b35;
            color: white;
        }

        a {
            color: #176b35;
            font-weight: bold;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>📊 Admin Activity Report</h1>

<p th:if="${message}"
   th:text="${message}"
   style="color:green; font-weight:bold;">
</p>

<!-- FARMER RECORDS -->
<div class="section">

    <h2>👨‍🌾 Recent Farmer Records</h2>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>District</th>
        </tr>

        <tr th:each="farmer : ${farmers}">
            <td th:text="${farmer.id}"></td>
            <td th:text="${farmer.name}"></td>
            <td th:text="${farmer.email}"></td>
            <td th:text="${farmer.district}"></td>
        </tr>
    </table>

</div>

<!-- PRODUCE LISTINGS -->
<div class="section">

    <h2>🌾 Farmer Produce Listings</h2>

    <table>
        <tr>
            <th>Crop</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Expected Price</th>
            <th>Location</th>
            <th>Action</th>
        </tr>

        <tr th:each="produce : ${produceList}">

            <td th:text="${produce.cropName}"></td>

            <td th:text="${produce.quantity}"></td>

            <td th:text="${produce.unit}"></td>

            <td th:text="${produce.expectedPrice}"></td>

            <td th:text="${produce.location}"></td>

            <td>
                <form th:action="@{/admin/delete-produce/{id}(id=${produce.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this listing?');">

                    <button type="submit" class="delete-btn">
                        Delete
                    </button>

                </form>
            </td>

        </tr>
    </table>

</div>

<!-- BUYER DEMANDS -->

<div class="section">

    <h2>📋 Buyer Crop Demands</h2>

    <table>
        <tr>
            <th>Crop</th>
            <th>Quantity</th>
            <th>Unit</th>
            <th>Location</th>
            <th>Action</th>
        </tr>

        <tr th:each="demand : ${demandList}">

            <td th:text="${demand.cropName}"></td>

            <td th:text="${demand.quantity}"></td>

            <td th:text="${demand.unit}"></td>

            <td th:text="${demand.location}"></td>

            <td>
                <form th:action="@{/admin/delete-demand/{id}(id=${demand.id})}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this buyer demand?');">

                    <button type="submit"
                            class="delete-btn">
                        Delete
                    </button>

                </form>
            </td>

        </tr>
    </table>

</div>

<p>
    <a th:href="@{/admin/dashboard}">
        ← Back to Admin Dashboard
    </a>
</p>

</body>
</html>

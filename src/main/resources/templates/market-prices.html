
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Market Price Comparison</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 30px;
        }

        h2 {
            color: #176b35;
            text-align: center;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #176b35;
            color: white;
        }
    </style>
</head>

<body>

<h2>🌾 Market Price Comparison</h2>

<table>
    <thead>
        <tr>
            <th>Crop</th>
            <th>Market</th>
            <th>District</th>
            <th>Price</th>
            <th>Unit</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="item : ${prices}">
            <td th:text="${item.cropName}"></td>
            <td th:text="${item.marketName}"></td>
            <td th:text="${item.district}"></td>
            <td th:text="'₹' + ${item.price}"></td>
            <td th:text="${item.unit}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(prices)}">
            <td colspan="5">
                No market prices are available yet.
            </td>
        </tr>

    </tbody>
</table>

<p style="text-align:center;">
    <a th:href="@{/dashboard}">Back to Farmer Dashboard</a>
</p>

</body>
</html>

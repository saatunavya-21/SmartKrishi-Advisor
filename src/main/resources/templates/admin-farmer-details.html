
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Farmer Details</title>
</head>
<body style="font-family:Arial; background:#f0f5f0; padding:30px;">

    <h1 style="color:#176b35;">Farmer Details</h1>

    <div style="background:white; padding:25px; border-radius:10px;">

        <p><b>ID:</b> <span th:text="${farmer.id}"></span></p>
        <p><b>Name:</b> <span th:text="${farmer.name}"></span></p>
        <p><b>Email:</b> <span th:text="${farmer.email}"></span></p>
        <p><b>Phone:</b> <span th:text="${farmer.phone}"></span></p>
        <p><b>Village:</b> <span th:text="${farmer.village}"></span></p>
        <p><b>District:</b> <span th:text="${farmer.district}"></span></p>
        <p><b>State:</b> <span th:text="${farmer.state}"></span></p>
        <p><b>Land Area:</b> <span th:text="${farmer.landArea}"></span></p>
        <p><b>Soil Type:</b> <span th:text="${farmer.soilType}"></span></p>

        <a th:href="@{/admin/dashboard}">Back to Dashboard</a>

    </div>

</body>
</html>

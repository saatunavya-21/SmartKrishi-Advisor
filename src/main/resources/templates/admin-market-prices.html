
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Market Prices</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 30px;
        }

        h2 {
            color: #176b35;
            text-align: center;
        }

        .card {
            background: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 650px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            background: #176b35;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #176b35;
            color: white;
        }
    </style>
</head>

<body>

<h2>📊 Manage Market Prices</h2>

<div class="card">

    <h3>Add New Market Price</h3>

    <p th:if="${message}"
       th:text="${message}"
       style="color:green;"></p>

    <form th:action="@{/admin/market-prices}" method="post">

        <label>Crop Name</label>
        <input type="text" name="cropName" required>

        <label>Market Name</label>
        <input type="text" name="marketName" required>

        <label>District</label>
        <input type="text" name="district" required>

        <label>Price (₹)</label>
        <input type="number" name="price"
               min="0.01" step="0.01" required>

        <label>Unit</label>
        <select name="unit" required>
            <option value="Quintal">Per Quintal</option>
            <option value="Kg">Per Kg</option>
        </select>

        <button type="submit">Save Market Price</button>

    </form>
</div>

<div class="card" style="max-width:100%;">

    <h3>Saved Market Prices</h3>

    <table>
        <thead>
            <tr>
                <th>Crop</th>
                <th>Market</th>
                <th>District</th>
                <th>Price</th>
                <th>Unit</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="item : ${prices}">
                <td th:text="${item.cropName}"></td>
                <td th:text="${item.marketName}"></td>
                <td th:text="${item.district}"></td>
                <td th:text="'₹' + ${item.price}"></td>
                <td th:text="${item.unit}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(prices)}">
                <td colspan="5">No market prices added yet.</td>
            </tr>
        </tbody>
    </table>

</div>

<p style="text-align:center;">
    <a th:href="@{/admin/dashboard}">Back to Admin Dashboard</a>
</p>

</body>
</html>


<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Crop Recommendation - Smart Krishi Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef7ee;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            color: green;
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            background: #e5f5e5;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>🌾 Crop Recommendation</h2>

    <form th:action="@{/crop-recommendation}" method="post">

        <label>Select Soil Type</label>
        <select name="soilType" required>
            <option value="">Choose Soil</option>
            <option value="Red Soil">Red Soil</option>
            <option value="Black Soil">Black Soil</option>
            <option value="Alluvial Soil">Alluvial Soil</option>
            <option value="Sandy Soil">Sandy Soil</option>
        </select>

        <label>Select Farming Season</label>
        <select name="season" required>
            <option value="">Choose Season</option>
            <option value="Kharif">Kharif</option>
            <option value="Rabi">Rabi</option>
            <option value="Summer">Summer</option>
        </select>

        <label>Water Availability</label>
        <select name="waterAvailability" required>
            <option value="">Choose Water Availability</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>

        <button type="submit">Get Crop Recommendations</button>

    </form>

    <div class="result" th:if="${crops != null}">

        <h3>Recommended Crops</h3>

        <p>
            Soil: <span th:text="${soilType}"></span>
        </p>

        <p>
            Season: <span th:text="${season}"></span>
        </p>

        <ul>
            <li th:each="crop : ${crops}"
                th:text="${crop}">
            </li>
        </ul>

        <p>
            <small>
                These are preliminary prototype suggestions.
                Confirm crop suitability using local soil-test
                results and agricultural expert advice.
            </small>
        </p>

    </div>

    <p style="text-align:center;">
        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </p>

</div>

</body>
</html>

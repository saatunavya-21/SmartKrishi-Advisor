
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Submit Crop Demand</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: #176b35;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #176b35;
            color: white;
            border: none;
            cursor: pointer;
        }

        .message {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>📋 Submit Crop Demand</h2>

    <p class="message" th:text="${message}"></p>

    <form th:action="@{/buyer/crop-demand}" method="post">

        <label>Crop Name</label>
        <input type="text" name="cropName" required>

        <label>Required Quantity</label>
        <input type="number" name="quantity"
               min="0.01" step="0.01" required>

        <label>Unit</label>
        <select name="unit" required>
            <option value="Kg">Kilograms</option>
            <option value="Quintal">Quintals</option>
        </select>

        <label>Required Location</label>
        <input type="text" name="location" required>

        <button type="submit">Submit Demand</button>

    </form>

    <p>
        <a th:href="@{/buyer/dashboard}">Back to Buyer Dashboard</a>
    </p>

</div>

</body>
</html>

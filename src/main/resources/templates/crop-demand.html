<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Crop Demand - Smart Krishi Advisor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5f0;
            padding: 30px;
            color: #263b2a;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        header {
            background: #176b35;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .card h2 {
            color: #176b35;
            margin-top: 0;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 10px;
            font-size: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button.btn-submit {
            background: #176b35;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            margin-top: 15px;
        }

        button.btn-submit:hover {
            background: #125228;
        }

        .msg-success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .msg-error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #176b35;
            color: white;
            font-size: 14px;
        }

        tr:nth-child(even) {
            background: #f9fbf9;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            background: #176b35;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>📋 Buyer Crop Procurement Demand</h1>
    </header>

    <div th:if="${message}" class="msg-success" th:text="${message}"></div>
    <div th:if="${errorMessage}" class="msg-error" th:text="${errorMessage}"></div>

    <!-- SUBMIT DEMAND FORM -->
    <div class="card">
        <h2>➕ Submit Crop Purchase Requirement</h2>

        <form th:action="@{/buyer/crop-demand}" method="post">
            <div class="form-grid">
                <div>
                    <label>Required Crop</label>
                    <input type="text" name="cropName" placeholder="e.g. Rice, Wheat, Cotton, Maize" required>
                </div>

                <div>
                    <label>Required Quantity</label>
                    <input type="number" name="quantity" min="0.01" step="0.01" placeholder="e.g. 100" required>
                </div>

                <div>
                    <label>Unit of Measure</label>
                    <select name="unit" required>
                        <option value="Quintal">Quintals</option>
                        <option value="Kg">Kilograms</option>
                    </select>
                </div>

                <div>
                    <label>Delivery / Procurement Location</label>
                    <input type="text" name="location" placeholder="e.g. Hyderabad Mandi / District" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Submit Crop Requirement</button>
        </form>
    </div>

    <!-- MY DEMANDS TABLE -->
    <div class="card">
        <h2>📋 My Submitted Crop Demands</h2>

        <table>
            <thead>
                <tr>
                    <th>Crop Name</th>
                    <th>Required Quantity</th>
                    <th>Unit</th>
                    <th>Delivery Location</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="demand : ${myDemands}">
                    <td><strong th:text="${demand.cropName}"></strong></td>
                    <td th:text="${demand.quantity}"></td>
                    <td th:text="${demand.unit}"></td>
                    <td th:text="${demand.location}"></td>
                    <td>
                        <form th:action="@{/buyer/crop-demand/delete/{id}(id=${demand.id})}" method="post"
                              onsubmit="return confirm('Are you sure you want to cancel this crop requirement?');">
                            <button type="submit" class="btn-delete">Cancel</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(myDemands)}">
                    <td colspan="5" style="padding:20px; color:#666;">
                        You have not submitted any crop purchase requirements yet. Use the form above to let farmers know what you need.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div style="text-align:center;">
        <a class="back-link" th:href="@{/buyer/dashboard}">← Back to Buyer Dashboard</a>
    </div>

</div>

</body>
</html>
